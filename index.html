<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مبادرة عزم - جدول الاختبارات</title>
<style>
  :root{
    --bg:#12151b;
    --surface:#1a1e26;
    --surface-2:#222731;
    --border:#2b303c;
    --cream:#e7d8c1;
    --navy:#13233d;
    --navy-light:#2c4568;
    --gold:#c9a227;
    --text:#eef1f6;
    --text-dim:#93a0b4;
    --text-faint:#5f6b7e;
    --ok:#6fae4a;
    --warn:#c9a227;
    --danger:#c9603a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Tahoma, 'Segoe UI', Arial, sans-serif;
    min-height:100vh;
  }

  .banner{
    background:var(--cream);
    padding:18px 18px 22px;
    text-align:center;
    position:relative;
  }
  .banner img{
    max-width:230px;
    width:60%;
    height:auto;
    display:block;
    margin:0 auto;
  }
  .menu-btn{
    position:absolute;
    top:16px;
    right:16px;
    width:38px;
    height:38px;
    border:1px solid rgba(19,35,61,0.25);
    background:rgba(255,255,255,0.35);
    border-radius:8px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:0;
  }
  .menu-btn span{width:18px;height:2px;background:var(--navy);border-radius:2px;}

  .wrap{max-width:760px;margin:0 auto;padding:22px 18px 60px;}

  header{text-align:center;margin-bottom:22px;}
  header h1{font-size:19px;margin:0 0 4px;font-weight:700;color:var(--text);}
  header p{font-size:13px;color:var(--text-dim);margin:0;}

  .page-title{font-size:16px;font-weight:700;margin:0 0 14px;color:var(--text);}

  .view{display:none;}
  .view.active{display:block;}

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
    margin-bottom:22px;
  }
  .panel h2{font-size:14px;margin:0 0 12px;color:var(--text-dim);font-weight:700;}
  .form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .form-grid .full{grid-column:1 / -1;}
  label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;}
  input, select{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:7px;
    padding:9px 10px;
    font-size:14px;
    font-family:inherit;
  }
  input:focus, select:focus{outline:none;border-color:var(--navy-light);}
  input[type="date"]{color-scheme:dark;}
  .add-btn{
    margin-top:12px;
    width:100%;
    background:var(--navy);
    color:var(--text);
    border:1px solid var(--navy-light);
    border-radius:7px;
    padding:10px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .add-btn:hover{background:var(--navy-light);}
  .error{color:var(--danger);font-size:12px;margin-top:8px;display:none;}
  .success{color:var(--ok);font-size:12px;margin-top:8px;display:none;}

  .list-title{font-size:15px;font-weight:700;margin:0 0 12px;color:var(--text);}
  .term-title{font-size:13px;font-weight:700;margin:0 0 10px;color:var(--gold);}
  .term-title-gap{margin-top:22px;}
  .empty{
    text-align:center;
    color:var(--text-faint);
    font-size:13px;
    padding:30px 10px;
    border:1px dashed var(--border);
    border-radius:10px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .card-info{flex:1;min-width:0;}
  .subject{font-size:15px;font-weight:700;color:var(--text);}
  .examname{font-size:13px;color:var(--text-dim);margin-top:2px;}
  .date{font-size:12px;color:var(--text-faint);margin-top:4px;}

  .status{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:5px;
    white-space:nowrap;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:700;
    padding:5px 10px;
    border-radius:20px;
  }
  .dot{width:7px;height:7px;border-radius:50%;flex:none;}

  .st-far{background:rgba(201,162,39,0.12);color:var(--warn);}
  .st-far .dot{background:var(--warn);}
  .st-near{background:rgba(201,96,58,0.14);color:var(--danger);}
  .st-near .dot{background:var(--danger);}
  .st-today{background:rgba(111,174,74,0.16);color:var(--ok);}
  .st-today .dot{background:var(--ok);}
  .st-unknown{background:rgba(147,160,180,0.14);color:var(--text-dim);}
  .st-unknown .dot{background:var(--text-dim);}
  .st-done{background:rgba(74,83,100,0.25);color:var(--text-faint);}
  .st-done .dot{background:var(--text-faint);}

  .countdown{font-size:11px;color:var(--text-faint);}
  .card-row{display:flex;align-items:center;gap:8px;}
  .icon-btn{
    background:none;
    border:none;
    color:var(--text-faint);
    font-size:16px;
    cursor:pointer;
    padding:4px 6px;
    line-height:1;
  }
  .icon-btn:hover{color:var(--danger);}

  .star-btn{
    background:none;
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text-faint);
    font-size:18px;
    cursor:pointer;
    padding:6px 10px;
    line-height:1;
    flex:none;
  }
  .star-btn.on{color:var(--gold);border-color:var(--gold);}

  .note{
    text-align:center;
    font-size:11px;
    color:var(--text-faint);
    margin-top:26px;
  }

  .backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
    z-index:40;
  }
  .backdrop.open{opacity:1;pointer-events:auto;}

  .drawer{
    position:fixed;
    top:0;
    right:0;
    height:100%;
    width:260px;
    max-width:80%;
    background:var(--surface);
    border-left:1px solid var(--border);
    transform:translateX(100%);
    transition:transform .2s ease;
    z-index:50;
    padding:18px;
    overflow-y:auto;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-top{
    background:var(--cream);
    border-radius:10px;
    padding:14px;
    text-align:center;
    margin-bottom:18px;
    position:relative;
  }
  .drawer-top img{width:70%;max-width:150px;height:auto;display:block;margin:0 auto;}
  .drawer-close{
    position:absolute;
    top:8px;
    left:8px;
    background:none;
    border:none;
    font-size:18px;
    color:var(--navy);
    cursor:pointer;
    line-height:1;
  }
  .nav-list{list-style:none;margin:0;padding:0;}
  .nav-item{
    display:block;
    width:100%;
    text-align:right;
    background:none;
    border:none;
    color:var(--text);
    font-size:14px;
    font-family:inherit;
    padding:12px 10px;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:4px;
  }
  .nav-item:hover{background:var(--surface-2);}
  .nav-item.active{background:var(--navy);color:var(--text);}

  .tg-link{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--border);
    color:var(--text-dim);
    text-decoration:none;
    font-size:13px;
  }
  .tg-link:hover{color:var(--text);}
  .tg-icon{
    width:26px;
    height:26px;
    flex:none;
    border-radius:50%;
    background:#229ed9;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .tg-icon svg{width:15px;height:15px;}

  .site-footer{
    text-align:center;
    margin-top:36px;
    padding-top:18px;
    border-top:1px solid var(--border);
  }
  .site-footer a{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--text-dim);
    text-decoration:none;
    font-size:13px;
  }
  .site-footer a:hover{color:var(--text);}
</style>
</head>

            <option value="الاختبار الفصلي الثاني">الاختبار الفصلي الثاني</option>
            <option value="النهائي">النهائي</option>
            <option value="كويز (اختبار قصير)">كويز (اختبار قصير)</option>
          </select>
        </div>
        <div>
          <label>تاريخ الاختبار</label>
          <input type="date" id="dateInput">
        </div>
      </div>
      <div class="error" id="formError">الرجاء تعبئة جميع الحقول</div>
      <div class="success" id="formSuccess">تم اضافة موعد الاختبار في المحفوظات</div>
      <button class="add-btn" id="addBtn">إضافة اختبار</button>
    </div>
    <div class="note">فريق مُتكامل ورؤية واضحة</div>
  </div>

  <div class="view" id="view-upcoming">
    <div class="page-title">اختباراتي القادمة (المحفوظات)</div>
    <div id="upcomingContainer"></div>
  </div>

  <div class="view" id="view-level3">
    <div class="page-title">مواد المستوى الثالث</div>
    <div id="level3Container"></div>
  </div>

  <div class="view" id="view-level4">
    <div class="page-title">مواد المستوى الرابع</div>
    <div id="level4Container"></div>
  </div>

  <div class="site-footer">
    <a href="https://t.me/+jWEsoGgXZGhmNzI0" target="_blank" rel="noopener" aria-label="مجتمع مبادرة عزم على تيليجرام">
      <span class="tg-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M21.5 3.5L2.5 10.8c-1 .4-1 1.7.1 2l4.6 1.5 1.8 5.6c.3.9 1.4 1.1 2 .4l2.6-2.9 4.9 3.6c.9.6 2.1.1 2.4-.9l3.3-15.3c.3-1.2-.9-2.2-2.1-1.3z" stroke="#fff" stroke-width="1.3" stroke-linejoin="round" fill="#fff"/></svg>
      </span>
    </a>
  </div>

</div>

<script>
const EXAMS_KEY = 'azm-exams-list';
const STARRED_KEY = 'azm-starred-subjects';
let exams = [];
let starred = [];
let currentView = 'add';
let successTimeout = null;

const LEVEL3 = [
  {id:'l3-1', subject:'ريض 106 | حساب التكامل', examName:'الاختبار الفصلي الاول', date:'2026-10-04', term:'first'},
  {id:'l3-2', subject:'ريض 107 | المتجهات والمصفوفات', examName:'الاختبار الفصلي الاول', date:'2026-10-06', term:'first'},
  {id:'l3-3', subject:'فيز 103 | الفيزياء العامة', examName:'الاختبار الفصلي الاول', date:'2026-10-12', term:'first'},
  {id:'l3-4', subject:'هعم 104 | الرسم الهندسي', examName:'', date:null, term:'first'},
  {id:'l3-5', subject:'نجم 109 | اللغة والتخاطب', examName:'الاختبار الفصلي الاول', date:'2026-11-05', term:'first'}
];

const LEVEL4 = [
  {id:'l4-1', subject:'ريض 203 | حساب التفاضل والتكامل', examName:'الاختبار الفصلي الاول', date:'2026-10-14', term:'first'},
  {id:'l4-2', subject:'فيز 104 | الفيزياء العامة (2)', examName:'الاختبار الفصلي الاول', date:'2026-10-05', term:'first'},
  {id:'l4-3', subject:'هعم 106 | تصميم هندسي', examName:'الاختبار الفصلي الاول', date:'2026-10-01', term:'first'},
  {id:'l4-4', subject:'نجم 110 | الكتابة التقنية', examName:'الاختبار الفصلي الاول', date:'2026-10-05', term:'first'}
];

function allFixedSubjects(){
  return LEVEL3.concat(LEVEL4);
}

function todayStart(){
  const d = new Date();
  d.setHours(0,0,0,0);
  return d;
}
function parseDate(str){
  return new Date(str + 'T00:00:00');
}
function dayDiff(dateStr){
  return Math.round((parseDate(dateStr) - todayStart()) / 86400000);
}
function formatDateArabic(dateStr){
  const d = parseDate(dateStr);
  const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}
function statusFor(dateStr){
  const diff = dayDiff(dateStr);
  if(diff < 0) return {cls:'st-done', label:'انتهى الاختبار', countdown:''};
  if(diff === 0) return {cls:'st-today', label:'يوم الاختبار', countdown:'اليوم'};
  if(diff <= 7) return {cls:'st-near', label:'اقترب الاختبار', countdown:'باقي ' + diff + ' يوم'};
  return {cls:'st-far', label:'متبقي وقت', countdown:'باقي ' + diff + ' يوم'};
}
function statusBlock(ex){
  if(!ex.date){
    return '<div class="status"><span class="badge st-unknown"><span class="dot"></span>التاريخ لم يُحدد حتى الان</span></div>';
  }
  const st = statusFor(ex.date);
  return '<div class="status">' +
      '<span class="badge ' + st.cls + '"><span class="dot"></span>' + st.label + '</span>' +
      (st.countdown ? '<span class="countdown">' + st.countdown + '</span>' : '') +
    '</div>';
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function loadExams(){
  try{
    const raw = localStorage.getItem(EXAMS_KEY);
    exams = raw ? JSON.parse(raw) : [];
  }catch(e){ exams = []; }
}
function saveExams(){
  try{ localStorage.setItem(EXAMS_KEY, JSON.stringify(exams)); }
  catch(e){ console.error('تعذر حفظ البيانات', e); }
}
function loadStarred(){
  try{
    const raw = localStorage.getItem(STARRED_KEY);
    starred = raw ? JSON.parse(raw) : [];
  }catch(e){ starred = []; }
}
function saveStarred(){
  try{ localStorage.setItem(STARRED_KEY, JSON.stringify(starred)); }
  catch(e){ console.error('تعذر حفظ البيانات', e); }
}

function addExam(){
  const subjectEl = document.getElementById('subjectInput');
  const examNameEl = document.getElementById('examNameInput');
  const dateEl = document.getElementById('dateInput');
  const errorEl = document.getElementById('formError');
  const successEl = document.getElementById('formSuccess');

  const subject = subjectEl.value.trim();
  const examName = examNameEl.value.trim();
  const date = dateEl.value;

  if(!subject || !examName || !date){
    errorEl.style.display = 'block';
    successEl.style.display = 'none';
    return;
  }
  errorEl.style.display = 'none';

  exams.push({
    id: 'p-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    subject: subject,
    examName: examName,
    date: date
  });

  subjectEl.value = '';
  examNameEl.selectedIndex = 0;
  dateEl.value = '';

  successEl.style.display = 'block';
  clearTimeout(successTimeout);
  successTimeout = setTimeout(function(){
    successEl.style.display = 'none';
  }, 5000);

  saveExams();
  if(currentView === 'upcoming') renderUpcoming();
}

function deletePersonalExam(id){
  exams = exams.filter(function(ex){ return ex.id !== id; });
  saveExams();
  renderUpcoming();
}

function toggleStar(id){
  if(starred.indexOf(id) === -1){
    starred.push(id);
  } else {
    starred = starred.filter(function(x){ return x !== id; });
  }
  saveStarred();
  renderLevelList('level3Container', LEVEL3);
  renderLevelList('level4Container', LEVEL4);
  if(currentView === 'upcoming') renderUpcoming();
}

function buildUpcoming(){
  const fixedAll = allFixedSubjects();
  const starredItems = fixedAll
    .filter(function(item){ return starred.indexOf(item.id) !== -1; })
    .map(function(item){ return {type:'starred', id:item.id, subject:item.subject, examName:item.examName, date:item.date}; });
  const personalItems = exams.map(function(ex){
    return {type:'personal', id:ex.id, subject:ex.subject, examName:ex.examName, date:ex.date};
  });
  return starredItems.concat(personalItems).sort(function(a,b){
    if(!a.date && !b.date) return 0;
    if(!a.date) return 1;
    if(!b.date) return -1;
    return parseDate(a.date) - parseDate(b.date);
  });
}

function renderUpcoming(){
  const container = document.getElementById('upcomingContainer');
  const list = buildUpcoming();
  if(list.length === 0){
    container.innerHTML = '<div class="empty">لا توجد اختبارات قادمة بعد. أضف اختبار أو ميّز مادة من القوائم</div>';
    return;
  }
  container.innerHTML = list.map(function(ex){
    const action = ex.type === 'personal'
      ? '<button class="icon-btn" data-action="del" data-id="' + ex.id + '" aria-label="حذف">✕</button>'
      : '<button class="icon-btn" data-action="unstar" data-id="' + ex.id + '" aria-label="إزالة التمييز">✕</button>';
    const examLine = ex.examName ? '<div class="examname">' + escapeHtml(ex.examName) + '</div>' : '';
    const dateLine = ex.date
      ? '<div class="date">' + formatDateArabic(ex.date) + '</div>'
      : '<div class="date">التاريخ لم يُحدد حتى الان</div>';
    return '<div class="card">' +
      '<div class="card-info">' +
        '<div class="subject">' + escapeHtml(ex.subject) + '</div>' +
        examLine +
        dateLine +
      '</div>' +
      '<div class="card-row">' +
        statusBlock(ex) +
        action +
      '</div>' +
    '</div>';
  }).join('');

  container.querySelectorAll('[data-action="del"]').forEach(function(btn){
    btn.addEventListener('click', function(){ deletePersonalExam(btn.getAttribute('data-id')); });
  });
  container.querySelectorAll('[data-action="unstar"]').forEach(function(btn){
    btn.addEventListener('click', function(){ toggleStar(btn.getAttribute('data-id')); });
  });
}

function renderSubjectCard(item){
  const isOn = starred.indexOf(item.id) !== -1;
  const examLine = item.examName ? '<div class="examname">' + escapeHtml(item.examName) + '</div>' : '';
  const dateLine = item.date
    ? '<div class="date">' + formatDateArabic(item.date) + '</div>'
    : '<div class="date">التاريخ لم يُحدد حتى الان</div>';
  return '<div class="card">' +
    '<div class="card-info">' +
      '<div class="subject">' + escapeHtml(item.subject) + '</div>' +
      examLine +
      dateLine +
    '</div>' +
    '<div class="card-row">' +
      statusBlock(item) +
      '<button class="star-btn ' + (isOn ? 'on' : '') + '" data-id="' + item.id + '" aria-label="تمييز">' + (isOn ? '★' : '☆') + '</button>' +
    '</div>' +
  '</div>';
}

function renderLevelList(containerId, list){
  const container = document.getElementById(containerId);
  const firstTerm = list.filter(function(item){ return item.term === 'first'; });
  const secondTerm = list.filter(function(item){ return item.term === 'second'; });

  let html = '<div class="term-title">الفصلي الاول</div>';
  html += firstTerm.length
    ? firstTerm.map(renderSubjectCard).join('')
    : '<div class="empty">لا توجد مواد مضافة بعد</div>';

  html += '<div class="term-title term-title-gap">الفصلي الثاني</div>';
  html += secondTerm.length
    ? secondTerm.map(renderSubjectCard).join('')
    : '<div class="empty">لم يتم إضافتها بعد</div>';

  container.innerHTML = html;

  container.querySelectorAll('.star-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ toggleStar(btn.getAttribute('data-id')); });
  });
}

function showView(view){
  currentView = view;
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
  document.getElementById('view-' + view).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function(btn){
    btn.classList.toggle('active', btn.getAttribute('data-view') === view);
  });
  if(view === 'upcoming') renderUpcoming();
  if(view === 'level3') renderLevelList('level3Container', LEVEL3);
  if(view === 'level4') renderLevelList('level4Container', LEVEL4);
  closeDrawer();
}

function openDrawer(){
  document.getElementById('drawer').classList.add('open');
  document.getElementById('backdrop').classList.add('open');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
}

document.getElementById('menuBtn').addEventListener('click', openDrawer);
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
document.getElementById('backdrop').addEventListener('click', closeDrawer);
document.querySelectorAll('.nav-item').forEach(function(btn){
  btn.addEventListener('click', function(){ showView(btn.getAttribute('data-view')); });
});

document.getElementById('addBtn').addEventListener('click', addExam);
document.getElementById('examNameInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') addExam();
});
[document.getElementById('subjectInput'), document.getElementById('examNameInput'), document.getElementById('dateInput')].forEach(function(el){
  el.addEventListener('input', function(){
    document.getElementById('formSuccess').style.display = 'none';
  });
});

document.getElementById('drawerLogo').src = document.getElementById('bannerLogo').src;

loadExams();
loadStarred();
showView('add');
setInterval(function(){
  if(currentView === 'upcoming') renderUpcoming();
  if(currentView === 'level3') renderLevelList('level3Container', LEVEL3);
  if(currentView === 'level4') renderLevelList('level4Container', LEVEL4);
}, 60000);
</script>
</body>
</html>
